<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px;
         font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; color: #666; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 5px 7px;
          border: 1px solid #ddd; border-radius: 5px; font: inherit; }
  button { margin-top: 11px; width: 100%; padding: 6px; font: inherit;
           border: 1px solid #ddd; border-radius: 5px; background: #fff; cursor: pointer; }
  button:hover { border-color: #c2410c; color: #c2410c; }
  .note { color: #888; font-size: 12px; margin-top: 9px; }
  #state { margin-top: 9px; font-size: 12px; }
</style>
</head>
<body>
  <h1>cowrite 发布助手</h1>
  <label for="port">端口</label>
  <input id="port" type="number" placeholder="8080">
  <label for="token">配对码</label>
  <input id="token" type="password" placeholder="从 cowrite 的发布设置里复制">
  <button id="save">保存并连接</button>
  <div id="state"></div>
  <div class="note">只连接本机的 cowrite，不会把内容发往别处。</div>
  <script src="popup.js"></script>
</body>
</html>
