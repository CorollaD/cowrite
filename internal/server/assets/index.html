<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cowrite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%8E%3C/text%3E%3C/svg%3E">

<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --border: #e6e4e1;
    --text: #23211e; --muted: #86817a; --accent: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1917; --panel: #232120; --border: #38342f;
      --text: #ece9e4; --muted: #948d84; --accent: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #sidebar {
    width: 260px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #sidebar header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #sidebar h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  button {
    font: inherit; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    padding: 4px 10px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #list { overflow-y: auto; flex: 1; }
  .item { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar {
    padding: 9px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    font-size: 13px; color: var(--muted); background: var(--panel);
  }
  #panes { flex: 1; display: flex; min-height: 0; }
  #editor {
    flex: 1; width: 50%; border: 0; outline: 0; resize: none;
    padding: 28px 32px; background: var(--bg); color: var(--text);
    font: 15px/1.75 ui-monospace, "SF Mono", Menlo, monospace;
  }
  #preview {
    flex: 1; width: 50%; border: 0; border-left: 1px solid var(--border);
    background: #fff;
  }
  body.solo #preview { display: none; }
  body.solo #editor { width: 100%; }
  #bar select, #bar .spacer { font: inherit; }
  #bar select {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px;
  }
  #bar .spacer { flex: 1; }
  #ai { display: flex; gap: 6px; }
  #ai button[disabled] { opacity: .4; cursor: default; }
  dialog {
    border: 1px solid var(--border); border-radius: 10px; padding: 0;
    background: var(--panel); color: var(--text); width: 440px; max-width: 92vw;
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 13px; }
  .dlg-body h2 { margin: 0; font-size: 15px; }
  .dlg-body label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .dlg-body input, .dlg-body select {
    width: 100%; font: inherit; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .dlg-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
  #result { position: fixed; inset: auto 0 0 0; display: none; }
  #result.show { display: block; }
  #result .inner {
    max-width: 780px; margin: 0 auto 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.14);
  }
  #result h3 { margin: 0 0 9px; font-size: 13px; color: var(--muted); font-weight: 500; }
  #resultText {
    white-space: pre-wrap; max-height: 260px; overflow-y: auto;
    font-size: 14px; line-height: 1.7; margin-bottom: 12px;
  }
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 9px 18px;
    border-radius: 7px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #empty {
    flex: 1; display: grid; place-items: center; color: var(--muted);
  }
  .warn { color: var(--accent); }
</style>
</head>
<body>
  <aside id="sidebar">
    <header><h1>cowrite</h1><button id="new">新建</button></header>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="bar">
      <span id="status">选择或新建一篇文章</span>
      <span id="words"></span>
      <span class="spacer"></span>
      <span id="ai">
        <button data-cmd="polish">润色</button>
        <button data-cmd="continue">续写</button>
        <button data-cmd="title">起标题</button>
        <button data-cmd="summary">摘要</button>
        <button id="aiSettings" title="AI 设置">⚙</button>
      </span>
      <select id="theme" title="预览主题"></select>
      <button id="toggle" title="切换预览">预览</button>
      <button id="copy" title="复制为公众号格式">复制公众号</button>
    </div>
    <div id="empty">← 从左侧开始</div>
    <div id="panes" style="display:none">
      <textarea id="editor" spellcheck="false"
                placeholder="# 标题&#10;&#10;开始写…"></textarea>
      <iframe id="preview" sandbox=""></iframe>
    </div>
  </main>
  <div id="result">
    <div class="inner">
      <h3 id="resultTitle">AI</h3>
      <div id="resultText"></div>
      <div class="dlg-actions">
        <button id="resultStop">停止</button>
        <button id="resultDismiss">丢弃</button>
        <button id="resultInsert">采用</button>
      </div>
    </div>
  </div>

  <dialog id="aiDialog">
    <form method="dialog" class="dlg-body">
      <h2>AI 设置</h2>
      <div>
        <label for="provider">服务商</label>
        <select id="provider"></select>
      </div>
      <div class="dlg-note" id="providerNote"></div>
      <div>
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="留空则不修改已保存的 key">
      </div>
      <div>
        <label for="model">模型</label>
        <input id="model" list="modelList" placeholder="例如 deepseek-chat">
        <datalist id="modelList"></datalist>
      </div>
      <div class="dlg-note">Key 存在系统钥匙串，不会写进工作区或索引，也不会回传浏览器。</div>
      <div class="dlg-actions">
        <button value="cancel">取消</button>
        <button id="aiSave" value="save">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  </main>

<script type="module">
const $ = s => document.querySelector(s);
const listEl = $('#list'), editor = $('#editor'), statusEl = $('#status'),
      wordsEl = $('#words'), emptyEl = $('#empty'), panesEl = $('#panes'),
      previewEl = $('#preview'), themeSel = $('#theme'), toastEl = $('#toast');

let theme = localStorage.getItem('cw.theme') || 'default';
let renderTimer = null;

let current = null;   // { id, hash }
let saveTimer = null;
let dirty = false;

const api = async (method, path, body) => {
  const res = await fetch('/api' + path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status, data });
  return data;
};

const countWords = t => (t.match(/[一-鿿]|[A-Za-z0-9]+/g) || []).length;

async function refreshList() {
  const posts = await api('GET', '/posts');
  listEl.innerHTML = '';
  for (const p of posts) {
    const el = document.createElement('div');
    el.className = 'item' + (current?.id === p.id ? ' active' : '');
    el.innerHTML = `<div class="t"></div><div class="m"></div>`;
    el.querySelector('.t').textContent = p.title || '无标题';
    el.querySelector('.m').textContent =
      `${p.wordCount} 字 · ${new Date(p.updatedAt * 1000).toLocaleDateString('zh-CN')}`;
    el.onclick = () => open(p.id);
    listEl.append(el);
  }
}

async function open(id) {
  if (dirty) await save();
  const p = await api('GET', `/posts/${id}`);
  current = { id: p.id, hash: p.hash };
  editor.value = p.body;
  panesEl.style.display = '';
  emptyEl.style.display = 'none';
  dirty = false;
  setStatus('已保存');
  updateWords();
  renderPreview();
  updateAIButtons();
  refreshList();
}

async function save() {
  if (!current || !dirty) return;
  clearTimeout(saveTimer);
  setStatus('保存中…');
  try {
    const p = await api('PUT', `/posts/${current.id}`, {
      body: editor.value,
      baseHash: current.hash,
    });
    current.hash = p.hash;
    dirty = false;
    setStatus('已保存');
    refreshList();
  } catch (err) {
    if (err.status === 409) {
      // The file changed underneath us. Never silently overwrite.
      setStatus('文件已在外部修改', true);
      const keepMine = confirm(
        '这个文件在别处被改过了。\n\n' +
        '确定 = 用编辑器里的版本覆盖磁盘\n' +
        '取消 = 丢弃编辑器内容，载入磁盘版本'
      );
      if (keepMine) {
        current.hash = err.data.diskHash;
        dirty = true;
        return save();
      }
      editor.value = err.data.diskBody;
      current.hash = err.data.diskHash;
      dirty = false;
      setStatus('已载入磁盘版本');
      updateWords();
    } else {
      setStatus('保存失败：' + err.message, true);
    }
  }
}

function setStatus(text, warn = false) {
  statusEl.textContent = text;
  statusEl.className = warn ? 'warn' : '';
}
function updateWords() { wordsEl.textContent = countWords(editor.value) + ' 字'; }

async function renderPreview() {
  if (panesEl.style.display === 'none') return;
  try {
    const r = await api('POST', '/render',
      { body: editor.value, profile: 'preview', theme });
    // srcdoc + sandbox: post styles cannot leak into the app, and post
    // content cannot run script against it.
    previewEl.srcdoc =
      `<!doctype html><meta charset="utf-8">` +
      `<style>body{margin:0;padding:26px 30px;}${r.css}</style>` + r.html;
  } catch (err) {
    setStatus('预览失败：' + err.message, true);
  }
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1800);
}

editor.addEventListener('input', () => {
  dirty = true;
  setStatus('未保存');
  updateWords();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);   // debounce
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderPreview, 250);
});
editor.addEventListener('blur', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('beforeunload', e => { if (dirty) { save(); e.preventDefault(); } });

$('#new').onclick = async () => {
  const p = await api('POST', '/posts', { title: '', body: '# 新文章\n\n' });
  await refreshList();
  await open(p.id);
  editor.focus();
};

$('#toggle').onclick = () => {
  document.body.classList.toggle('solo');
  renderPreview();
};

themeSel.onchange = () => {
  theme = themeSel.value;
  localStorage.setItem('cw.theme', theme);
  renderPreview();
};

$('#copy').onclick = async () => {
  if (!current) return;
  try {
    const r = await api('POST', '/render',
      { body: editor.value, profile: 'wechat', theme });
    // Copy as text/html so the styling survives the paste into WeChat.
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([r.html], { type: 'text/html' }),
      'text/plain': new Blob([r.html], { type: 'text/plain' }),
    })]);
    toast('已复制，去公众号编辑器粘贴');
  } catch (err) {
    toast('复制失败：' + err.message);
  }
};

async function loadThemes() {
  const list = await api('GET', '/themes');
  themeSel.innerHTML = '';
  for (const t of list) {
    const o = document.createElement('option');
    o.value = t.id;
    o.textContent = t.name;
    themeSel.append(o);
  }
  if (!list.some(t => t.id === theme)) theme = 'default';
  themeSel.value = theme;
}

// ---- AI ----------------------------------------------------------------

const resultEl = $('#result'), resultText = $('#resultText'),
      resultTitle = $('#resultTitle'), dlg = $('#aiDialog'),
      providerSel = $('#provider'), providerNote = $('#providerNote'),
      modelInput = $('#model'), modelList = $('#modelList'), apiKeyInput = $('#apiKey');

let providers = [], commands = [], aiCfg = null;
let activeStream = null, activeJob = null, lastScope = null;

async function loadAI() {
  const r = await api('GET', '/ai/config');
  providers = r.providers; commands = r.commands; aiCfg = r.config;

  providerSel.innerHTML = '';
  for (const p of providers) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name + (p.free ? ' · 免费' : '');
    providerSel.append(o);
  }
  if (aiCfg.providerId) providerSel.value = aiCfg.providerId;
  showProviderNote();
  modelInput.value = aiCfg.model || '';
  updateAIButtons();
}

function showProviderNote() {
  const p = providers.find(x => x.id === providerSel.value);
  providerNote.textContent = p ? p.notes : '';
  modelList.innerHTML = '';
  for (const m of (p?.models || [])) {
    const o = document.createElement('option');
    o.value = m;
    modelList.append(o);
  }
  if (p && !modelInput.value) modelInput.value = p.models?.[0] || '';
  apiKeyInput.placeholder = p?.auth === 'none'
    ? '本地服务，不需要 key'
    : (aiCfg?.hasKey ? '已保存，留空则不修改' : '粘贴你的 API Key');
}

function updateAIButtons() {
  const ready = aiCfg && aiCfg.baseURL && aiCfg.model;
  for (const b of document.querySelectorAll('#ai button[data-cmd]')) {
    b.disabled = !ready || !current;
  }
}

providerSel.onchange = () => { modelInput.value = ''; showProviderNote(); };

$('#aiSettings').onclick = async () => {
  await loadAI();
  dlg.showModal();
};

$('#aiSave').onclick = async () => {
  // The dialog closes itself; save before it does.
  try {
    aiCfg = await api('PUT', '/ai/config', {
      providerId: providerSel.value,
      model: modelInput.value.trim(),
      apiKey: apiKeyInput.value,
    });
    apiKeyInput.value = '';
    updateAIButtons();
    toast('已保存');
  } catch (err) {
    toast('保存失败：' + err.message);
  }
};

// Pick the text a command runs on: its selection, the text before the
// cursor, or the whole document.
function textFor(scope) {
  const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
  if (scope === 'selection') {
    return sel.trim()
      ? { text: sel, start: editor.selectionStart, end: editor.selectionEnd }
      : { text: editor.value, start: 0, end: editor.value.length };
  }
  if (scope === 'cursor') {
    const end = editor.selectionEnd;
    return { text: editor.value.slice(0, end), start: end, end, append: true };
  }
  return { text: editor.value, start: 0, end: editor.value.length, readonly: true };
}

async function runCommand(id) {
  const cmd = commands.find(c => c.id === id);
  if (!cmd) return;

  const scope = textFor(cmd.scope);
  if (!scope.text.trim()) { toast('没有可处理的文字'); return; }
  lastScope = scope;

  resultTitle.textContent = cmd.label + ' 生成中…';
  resultText.textContent = '';
  resultEl.classList.add('show');

  try {
    const { jobId } = await api('POST', '/ai/run', { command: id, text: scope.text });
    activeJob = jobId;
    const es = new EventSource(`/api/ai/stream/${jobId}`);
    activeStream = es;

    es.addEventListener('delta', e => { resultText.textContent += JSON.parse(e.data); });
    es.addEventListener('done', () => {
      resultTitle.textContent = cmd.label;
      es.close(); activeStream = null; activeJob = null;
    });
    es.addEventListener('error', e => {
      resultTitle.textContent = cmd.label + ' 失败';
      if (e.data) resultText.textContent += '\n\n[' + e.data + ']';
      es.close(); activeStream = null; activeJob = null;
    });
  } catch (err) {
    resultTitle.textContent = cmd.label + ' 失败';
    resultText.textContent = err.message;
  }
}

for (const b of document.querySelectorAll('#ai button[data-cmd]')) {
  b.onclick = () => runCommand(b.dataset.cmd);
}

function stopStream() {
  if (activeStream) { activeStream.close(); activeStream = null; }
  if (activeJob) { api('DELETE', `/ai/stream/${activeJob}`).catch(() => {}); activeJob = null; }
}

$('#resultStop').onclick = () => { stopStream(); resultTitle.textContent = '已停止'; };
$('#resultDismiss').onclick = () => { stopStream(); resultEl.classList.remove('show'); };

// Insert replaces the range the command read, so the user sees the result
// applied exactly where it came from rather than dumped at the cursor.
$('#resultInsert').onclick = () => {
  stopStream();
  const out = resultText.textContent;
  if (!out || !lastScope) return;
  const v = editor.value;
  editor.value = lastScope.append
    ? v.slice(0, lastScope.start) + out + v.slice(lastScope.start)
    : v.slice(0, lastScope.start) + out + v.slice(lastScope.end);
  resultEl.classList.remove('show');
  dirty = true;
  updateWords();
  renderPreview();
  save();
};

loadThemes();
loadAI();
refreshList();
</script>
</body>
</html>
